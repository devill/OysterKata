[project]
name = "oyster"
version = "0.1.0"
description = "Billing service for London transport travel"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "approvaltests>=14",
    "pyyaml>=6",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Branch coverage is gated on the business logic reachable through the data-in
# seam (render_invoice_html). All external-service access now lives in the
# entry points (oyster/cli.py, scripts/), which cannot be run from a constrained
# test, so the library itself needs no per-symbol coverage exclusions.
[tool.coverage.run]
branch = true
omit = ["oyster/cli.py"]
